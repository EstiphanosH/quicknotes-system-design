<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickNotes — API Client</title>
  <link rel="stylesheet" href="style.css" />
  <script src="api.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p class="subtitle">Practice client talking to JSONPlaceholder</p>
  </header>

  <main>
    <section aria-labelledby="load-heading">
      <h2 id="load-heading">Notes</h2>
      <button id="load-btn" type="button">Load notes</button>
      <p id="status" role="status" aria-live="polite"></p>
      <ul id="notes-list" aria-label="Notes list"></ul>
    </section>

    <section aria-labelledby="create-heading">
      <h2 id="create-heading">Create a note</h2>
      <form id="note-form" novalidate>
        <div class="field">
          <label for="title-input">Title (required, max 100 characters)</label>
          <input
            id="title-input"
            name="title"
            type="text"
            maxlength="100"
            required
            autocomplete="off"
          />
        </div>

        <div class="field">
          <label for="body-input">Body (optional)</label>
          <textarea id="body-input" name="body" rows="3"></textarea>
        </div>

        <button id="submit-btn" type="submit">Create note</button>
      </form>
    </section>
    <footer class="site-footer">
      <p>&copy; 2026 QuickNotes. All rights reserved.</p>
    </footer>
  </main>
</body>
</html>
